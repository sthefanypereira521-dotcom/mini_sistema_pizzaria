<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - Pizzaria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #1c1010;
            --surface: #fffaf8;
            --ink: #241414;
            --muted: #8a7370;
            --red-primary: #8b1e1e;
            --red-primary-hover: #6b1414;
            --border: #e4d6d3;
            --success-bg: #e3f1e6;
            --success-text: #1f5c33;
            --success-border: #bfe0c8;
            --error-bg: #fbe4e2;
            --error-text: #7a231d;
            --error-border: #f0bcb7;
            --amber: #b5651d;
            --amber-hover: #944f14;
            --green: #3f7d4a;
            --green-hover: #2f5f38;
        }

        body {
            font-family: 'Fira Code', monospace;
            min-height: 100vh;
            background: var(--bg);
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            padding: 20px 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .header h1 {
            color: #fdf6f5;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.55);
            font-size: 13px;
            margin-top: 4px;
        }

        .btn-logout {
            padding: 10px 20px;
            background: rgba(220, 60, 50, 0.15);
            color: #e08a80;
            border: 1px solid rgba(220, 60, 50, 0.3);
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.2s ease;
        }

        .btn-logout:hover {
            background: rgba(220, 60, 50, 0.3);
        }

        /* Navigation Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 22px;
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .tab-btn.active {
            background: var(--red-primary);
            color: #fff;
            border-color: transparent;
        }

        /* Content Panels */
        .panel {
            display: none;
        }

        .panel.active {
            display: block;
        }

        /* Cards */
        .card {
            background: var(--surface);
            border-radius: 12px;
            padding: 30px;
            border: 1px solid var(--border);
        }

        .card h2 {
            color: var(--ink);
            font-size: 19px;
            margin-bottom: 20px;
        }

        .card h2::before {
            content: "> ";
            color: var(--red-primary);
        }

        /* Forms */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: var(--ink);
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Fira Code', monospace;
            transition: border-color 0.2s ease, background 0.2s ease;
            background: #fdf6f5;
            color: var(--ink);
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--red-primary);
            background: #fff;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn {
            padding: 12px 26px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Fira Code', monospace;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn-primary {
            background: var(--red-primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--red-primary-hover);
        }

        .btn-danger {
            background: #a52a2a;
            color: white;
        }

        .btn-danger:hover {
            background: #841f1f;
        }

        .btn-success {
            background: var(--green);
            color: white;
        }

        .btn-success:hover {
            background: var(--green-hover);
        }

        .btn-warning {
            background: var(--amber);
            color: white;
        }

        .btn-warning:hover {
            background: var(--amber-hover);
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 12px;
            border-radius: 6px;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Messages */
        .message {
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 13px;
            display: none;
        }

        .message.success {
            background: var(--success-bg);
            color: var(--success-text);
            border: 1px solid var(--success-border);
            display: block;
        }

        .message.error {
            background: var(--error-bg);
            color: var(--error-text);
            border: 1px solid var(--error-border);
            display: block;
        }

        /* Orders List */
        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .order-card {
            background: #fdf8f7;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid var(--border);
            transition: border-color 0.2s ease;
        }

        .order-card:hover {
            border-color: var(--red-primary);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .order-id {
            font-weight: 700;
            color: var(--ink);
            font-size: 15px;
        }

        .order-status {
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-PENDENTE {
            background: #f6e4c8;
            color: #7a5416;
        }

        .status-CANCELADA, .status-CANCELADO {
            background: var(--error-bg);
            color: var(--error-text);
        }

        .status-FINALIZADO {
            background: var(--success-bg);
            color: var(--success-text);
        }

        .order-items {
            margin: 10px 0;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .order-item .item-info {
            color: #5c4b48;
        }

        .order-item .item-price {
            color: var(--ink);
            font-weight: 600;
        }

        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .order-total {
            font-size: 16px;
            font-weight: 700;
            color: var(--red-primary);
        }

        .order-actions {
            display: flex;
            gap: 8px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--muted);
        }

        .empty-state p {
            font-size: 14px;
        }

        /* Spinner */
        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn.loading .spinner {
            display: block;
        }

        .btn.loading .btn-text {
            display: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .tabs {
                justify-content: center;
            }

            .order-header {
                flex-direction: column;
                gap: 8px;
            }

            .order-footer {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div>
                <h1>PIZZARIA</h1>
                <p>Gerencie seus pedidos</p>
            </div>
            <button class="btn-logout" onclick="logout()">Sair</button>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="showPanel('meus-pedidos', this)">Meus Pedidos</button>
            <button class="tab-btn" onclick="showPanel('novo-pedido', this)">Novo Pedido</button>
            <button class="tab-btn" onclick="showPanel('ver-pedido', this)">Ver Pedido</button>
            <button class="tab-btn" onclick="showPanel('listar-todos', this)">Listar Todos</button>
        </div>

        <!-- Panel: Meus Pedidos -->
        <div id="meus-pedidos" class="panel active">
            <div class="card">
                <h2>Meus Pedidos</h2>
                <div id="meus-pedidos-list" class="orders-list">
                    <div class="empty-state">
                        <p>Carregando seus pedidos...</p>
                    </div>
                </div>
                <div id="meus-pedidos-message" class="message"></div>
            </div>
        </div>

        <!-- Panel: Novo Pedido -->
        <div id="novo-pedido" class="panel">
            <div class="card">
                <h2>Criar Novo Pedido</h2>
                <form id="form-novo-pedido">
                    <div class="form-group">
                        <label for="id_usuario">ID do Usuário</label>
                        <input type="number" id="id_usuario" placeholder="Digite o ID do usuário" required>
                    </div>
                    <button type="submit" class="btn btn-primary" id="btn-criar-pedido">
                        <span class="btn-text">Criar Pedido</span>
                        <div class="spinner"></div>
                    </button>
                </form>
                <div id="novo-pedido-message" class="message"></div>
            </div>
        </div>

        <!-- Panel: Ver Pedido -->
        <div id="ver-pedido" class="panel">
            <div class="card">
                <h2>Visualizar Pedido</h2>
                <form id="form-ver-pedido">
                    <div class="form-group">
                        <label for="ver_id_pedido">ID do Pedido</label>
                        <input type="number" id="ver_id_pedido" placeholder="Digite o ID do pedido" required>
                    </div>
                    <button type="submit" class="btn btn-primary" id="btn-ver-pedido">
                        <span class="btn-text">Buscar Pedido</span>
                        <div class="spinner"></div>
                    </button>
                </form>
                <div id="pedado-detalhes" style="margin-top: 20px;"></div>
                <div id="ver-pedido-message" class="message"></div>
            </div>
        </div>

        <!-- Panel: Listar Todos (Admin) -->
        <div id="listar-todos" class="panel">
            <div class="card">
                <h2>Todos os Pedidos (Admin)</h2>
                <button class="btn btn-primary" onclick="listarTodosPedidos()" id="btn-listar-todos" style="margin-bottom: 20px;">
                    <span class="btn-text">Listar Todos</span>
                    <div class="spinner"></div>
                </button>
                <div id="todos-pedidos-list" class="orders-list">
                    <div class="empty-state">
                        <p>Clique em "Listar Todos" para ver todos os pedidos</p>
                    </div>
                </div>
                <div id="listar-todos-message" class="message"></div>
            </div>
        </div>
    </div>

    <script src="pedidos.js"></script>
</body>
</html>
