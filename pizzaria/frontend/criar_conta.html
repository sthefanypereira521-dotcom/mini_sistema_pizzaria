<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Pizzaria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            padding: 20px;
        }

        .register-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo .icon {
            font-size: 60px;
            display: block;
            margin-bottom: 10px;
        }

        .logo h1 {
            color: #c0392b;
            font-size: 28px;
            font-weight: 700;
        }

        .logo p {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group label span {
            margin-right: 5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            opacity: 0.5;
        }

        .form-group input {
            width: 100%;
            padding: 14px 14px 14px 45px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .form-group input:focus {
            outline: none;
            border-color: #c0392b;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(192, 57, 43, 0.1);
        }

        .form-group input::placeholder {
            color: #aaa;
        }

        .btn-register {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(192, 57, 43, 0.4);
        }

        .btn-register:active {
            transform: translateY(0);
        }

        .btn-register:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-register .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        .btn-register.loading .spinner {
            display: block;
        }

        .btn-register.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .message {
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 14px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0e0e0;
        }

        .divider span {
            padding: 0 15px;
            color: #999;
            font-size: 13px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #c0392b;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .login-link a:hover {
            color: #e74c3c;
            text-decoration: underline;
        }

        .password-strength {
            margin-top: 6px;
            height: 4px;
            border-radius: 2px;
            background: #e0e0e0;
            overflow: hidden;
        }

        .password-strength .bar {
            height: 100%;
            border-radius: 2px;
            transition: all 0.3s ease;
            width: 0%;
        }

        .password-strength .bar.weak {
            width: 33%;
            background: #e74c3c;
        }

        .password-strength .bar.medium {
            width: 66%;
            background: #f39c12;
        }

        .password-strength .bar.strong {
            width: 100%;
            background: #27ae60;
        }

        .password-hint {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        @media (max-width: 480px) {
            .register-container {
                padding: 30px 20px;
            }

            .logo h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo">
            <span class="icon">🍕</span>
            <h1>Pizzaria</h1>
            <p>Crie sua conta para começar</p>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label for="nome"><span>👤</span> Nome</label>
                <div class="input-wrapper">
                    <span class="input-icon">🙍</span>
                    <input id="nome" type="text" placeholder="Seu nome completo" required autocomplete="name">
                </div>
            </div>

            <div class="form-group">
                <label for="email"><span>📧</span> E-mail</label>
                <div class="input-wrapper">
                    <span class="input-icon">✉️</span>
                    <input id="email" type="email" placeholder="seu@email.com" required autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <label for="senha"><span>🔒</span> Senha</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔑</span>
                    <input id="senha" type="password" placeholder="Crie uma senha" required autocomplete="new-password">
                </div>
                <div class="password-strength">
                    <div class="bar" id="strengthBar"></div>
                </div>
                <p class="password-hint">Mínimo 6 caracteres</p>
            </div>

            <div class="form-group">
                <label for="confirmar_senha"><span>🔐</span> Confirmar Senha</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔑</span>
                    <input id="confirmar_senha" type="password" placeholder="Repita a senha" required autocomplete="new-password">
                </div>
            </div>

            <button type="submit" class="btn-register" id="btnRegister">
                <span class="btn-text">Criar Conta</span>
                <div class="spinner"></div>
            </button>
        </form>

        <div id="message" class="message"></div>

        <div class="divider">
            <span>ou</span>
        </div>

        <div class="login-link">
            Já tem conta? <a href="login.html">Fazer login</a>
        </div>
    </div>

    <script src="criar_conta.js"></script>
</body>
</html>
