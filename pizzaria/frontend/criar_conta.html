<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Pizzaria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #1c1010;
            --surface: #fffaf8;
            --ink: #241414;
            --muted: #8a7370;
            --red-primary: #8b1e1e;
            --red-primary-hover: #6b1414;
            --border: #e4d6d3;
            --success-bg: #e3f1e6;
            --success-text: #1f5c33;
            --success-border: #bfe0c8;
            --error-bg: #fbe4e2;
            --error-text: #7a231d;
            --error-border: #f0bcb7;
            --strength-weak: #a52a2a;
            --strength-medium: #b5651d;
            --strength-strong: #3f7d4a;
        }

        body {
            font-family: 'Fira Code', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            padding: 20px;
        }

        .register-container {
            background: var(--surface);
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            border: 1px solid var(--border);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: var(--red-primary);
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .logo p {
            color: var(--muted);
            font-size: 13px;
            margin-top: 8px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: var(--ink);
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group label::before {
            content: "> ";
            color: var(--red-primary);
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Fira Code', monospace;
            transition: border-color 0.2s ease, background 0.2s ease;
            background: #fdf6f5;
            color: var(--ink);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--red-primary);
            background: #fff;
        }

        .form-group input::placeholder {
            color: #b7a6a3;
        }

        .btn-register {
            width: 100%;
            padding: 14px;
            background: var(--red-primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Fira Code', monospace;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-top: 10px;
            position: relative;
        }

        .btn-register:hover {
            background: var(--red-primary-hover);
        }

        .btn-register:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn-register .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        .btn-register.loading .spinner {
            display: block;
        }

        .btn-register.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .message {
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 13px;
            display: none;
        }

        .message.success {
            background: var(--success-bg);
            color: var(--success-text);
            border: 1px solid var(--success-border);
            display: block;
        }

        .message.error {
            background: var(--error-bg);
            color: var(--error-text);
            border: 1px solid var(--error-border);
            display: block;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider span {
            padding: 0 15px;
            color: var(--muted);
            font-size: 12px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
        }

        .login-link a {
            color: var(--red-primary);
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .password-strength {
            margin-top: 6px;
            height: 4px;
            border-radius: 2px;
            background: var(--border);
            overflow: hidden;
        }

        .password-strength .bar {
            height: 100%;
            border-radius: 2px;
            transition: width 0.2s ease, background 0.2s ease;
            width: 0%;
        }

        .password-strength .bar.weak {
            width: 33%;
            background: var(--strength-weak);
        }

        .password-strength .bar.medium {
            width: 66%;
            background: var(--strength-medium);
        }

        .password-strength .bar.strong {
            width: 100%;
            background: var(--strength-strong);
        }

        .password-hint {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
        }

        @media (max-width: 480px) {
            .register-container {
                padding: 30px 20px;
            }

            .logo h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo">
            <h1>PIZZARIA</h1>
            <p>Crie sua conta para começar</p>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label for="nome">Nome</label>
                <input id="nome" type="text" placeholder="Seu nome completo" required autocomplete="name">
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input id="email" type="email" placeholder="seu@email.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input id="senha" type="password" placeholder="Crie uma senha" required autocomplete="new-password">
                <div class="password-strength">
                    <div class="bar" id="strengthBar"></div>
                </div>
                <p class="password-hint">Mínimo 6 caracteres</p>
            </div>

            <div class="form-group">
                <label for="confirmar_senha">Confirmar Senha</label>
                <input id="confirmar_senha" type="password" placeholder="Repita a senha" required autocomplete="new-password">
            </div>

            <button type="submit" class="btn-register" id="btnRegister">
                <span class="btn-text">Criar Conta</span>
                <div class="spinner"></div>
            </button>
        </form>

        <div id="message" class="message"></div>

        <div class="divider">
            <span>ou</span>
        </div>

        <div class="login-link">
            Já tem conta? <a href="login.html">Fazer login</a>
        </div>
    </div>

    <script src="criar_conta.js"></script>
</body>
</html>
