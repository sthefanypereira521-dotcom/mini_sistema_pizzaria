[project]
name = "pizzaria"
version = "0.1.0"
description = ""
authors = [
    {name = "sthefanypereira",email = "sthefanypereira521@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "pydantic[email] (>=2.13.4,<3.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "bcrypt (==4.0.1)",
    "uvicorn[standard] (>=0.52.1,<0.53.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "sqlalchemy-utils (>=0.42.1,<0.43.0)",
    "psycopg2 (>=2.9.12,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "httpx (>=0.28.1,<0.29.0)"
]


[tool.pytest.ini_options]
pythonpath = ["."]